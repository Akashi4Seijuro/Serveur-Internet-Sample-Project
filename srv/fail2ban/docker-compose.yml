version: "3.8"

services:
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    restart: unless-stopped

    network_mode: host

    cap_add:
      - NET_ADMIN
      - NET_RAW

    env_file:
      - .env

    environment:
      TZ: ${TZ}
      F2B_LOG_LEVEL: ${F2B_LOG_LEVEL}
      F2B_DB_PURGE_AGE: ${F2B_DB_PURGE_AGE}

    volumes:
      - /var/log:/var/log:ro
      - /var/lib/fail2ban:/var/lib/fail2ban
      - ./jail.d:/etc/fail2ban/jail.d
      - fail2ban-run:/var/run/fail2ban


  fail2ban-ui:
    image: swissmakers/fail2ban-ui:latest
    container_name: fail2ban-ui
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}

    networks:
      - proxy

    volumes:
      - fail2ban-run:/var/run/fail2ban

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.fail2ban.rule=Host(`${F2B_UI_HOST}`)"
      - "traefik.http.routers.fail2ban.entrypoints=websecure"
      - "traefik.http.routers.fail2ban.tls=true"

      - "traefik.http.services.fail2ban.loadbalancer.server.port=${F2B_UI_PORT}"
      - "traefik.http.routers.fail2ban.middlewares=tinyauth@docker"

networks:
  proxy:
    external: true

volumes:
  fail2ban-run:
