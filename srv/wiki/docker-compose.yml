version: "3.8"

services:
  wiki:
    image: redimp/otterwiki:latest
    container_name: otterwiki

    env_file:
      - .env

    environment:
      TZ: ${TZ}

    volumes:
      - ./data:${OTTERWIKI_DATA_DIR}

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wiki.rule=Host(`${WIKI_HOST}`)"
      - "traefik.http.routers.wiki.entrypoints=websecure"
      - "traefik.http.routers.wiki.tls=true"
      - "traefik.http.services.wiki.loadbalancer.server.port=${OTTERWIKI_PORT}"

networks:
  proxy:
    external: true
